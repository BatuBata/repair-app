server {
    listen 80;
    listen [::]:80;
    server_name demo-repair-app.scannara.asia;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/demo-repair-app/acme; }
    location / { return 301 https://demo-repair-app.scannara.asia$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo-repair-app.scannara.asia;
    ssl_certificate /etc/letsencrypt/live/demo-repair-app.scannara.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo-repair-app.scannara.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/demo-repair-app/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 4m;
    server_tokens off;
    access_log /var/log/demo-repair-app/nginx-access.log;
    error_log /var/log/demo-repair-app/nginx-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Deploy operator controls this gate; remove only after all release gates pass.
    if (-f /var/www/demo-repair-app/.deploy-pending) { return 503; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/demo-repair-app.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
    # Only raster logos are public; never use a ^~ /storage PHP bypass.
    location ~* ^/storage/logos/[A-Za-z0-9_-]+\.(?:png|jpe?g|gif|webp)$ {
        try_files $uri =404;
    }
    location ~* ^/(?:vendor|storage|bootstrap|config|database|deploy|docs)(?:/|$) { return 404; }
    location ~* \.(?:env|sql|gz|bak|log|ini|ya?ml)$ { return 404; }
}
