server {
    listen 80;
    listen [::]:80;
    server_name demo-repair-app.scannara.asia;
    server_tokens off;
    access_log /var/log/demo-repair-app/nginx-access.log;
    error_log /var/log/demo-repair-app/nginx-error.log;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/demo-repair-app/acme; }
    location / { return 503; }
}
