[demo-repair-app]
user = www-data
group = www-data
listen = /run/php/demo-repair-app.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/demo-repair-app/php-error.log
php_admin_value[date.timezone] = Asia/Makassar
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 4M
