/var/log/demo-repair-app/nginx-*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    create 0640 root adm
    postrotate
        /bin/systemctl kill --signal=USR1 --kill-who=main nginx.service 2>/dev/null || true
    endscript
}
/var/log/demo-repair-app/php-error.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data www-data
    postrotate
        /bin/systemctl kill --signal=USR1 --kill-who=main php8.3-fpm.service 2>/dev/null || true
    endscript
}
