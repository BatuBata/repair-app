[global]
daemonize = no
error_log = /private/tmp/t017-a3-fpm-final/error.log
pid = /private/tmp/t017-a3-fpm-final/master.pid
[synthetic]
user = muzib
group = staff
listen = /private/tmp/t017-a3-fpm-final/fpm.sock
pm = static
pm.max_children = 1
clear_env = no
php_admin_value[max_execution_time] = 30
php_admin_value[memory_limit] = 128M
